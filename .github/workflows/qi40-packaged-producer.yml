name: QI-40 packaged Theory Lab producer

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  packaged-producer:
    runs-on: windows-2025
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: "24"
          cache: npm
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - run: npm ci
      - run: python -m venv .venv
      - name: Install pinned worker and packaging dependencies
        run: |
          .\.venv\Scripts\python.exe -m pip install -c workers/quantum-python/requirements.lock -e workers/quantum-python
          .\.venv\Scripts\python.exe -m pip install -r workers/quantum-python/requirements-packaging.txt
      - run: npm run typecheck
      - run: npm run test:qi40-source
      - run: npm run test:math3d-handoff
      - run: npm run test:math3d-installed-target
      - run: node scripts/build-frozen-worker.mjs
      - name: Package unpacked Windows candidate
        run: npx electron-builder --win --dir --config electron-builder.config.cjs --config.directories.output=artifacts/qi40-packaged-candidate
      - name: Accept packaged QWZ producer and record hashes
        shell: pwsh
        run: |
          $root = (Resolve-Path -LiteralPath 'artifacts/qi40-packaged-candidate/win-unpacked').Path
          $exe = Join-Path $root 'Quantum Hamiltonian Lab.exe'
          $appAsar = Join-Path $root 'resources/app.asar'
          $worker = Join-Path $root 'resources/quantum-worker/quantum-worker.exe'
          $exeHash = (Get-FileHash -Algorithm SHA256 -LiteralPath $exe).Hash.ToLowerInvariant()
          $acceptance = 'artifacts/qi40-packaged-candidate/packaged-producer-acceptance.json'
          $retained = 'artifacts/qi40-packaged-candidate/retained'
          node scripts/accept-packaged-qwz.mjs $exe $exeHash --retain $retained > $acceptance
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          npm run verify:qi40-retained -- $retained
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $record = Get-Content -LiteralPath $acceptance -Raw | ConvertFrom-Json
          if ($record.schema -ne 'theory-lab/qi40-packaged-producer-acceptance/v2' -or $record.executableSha256 -ne $exeHash) {
            throw 'Packaged acceptance identity mismatch'
          }
          [ordered]@{
            schema = 'theory-lab/qi40-packaged-candidate/v1'
            sourceCommit = '${{ github.sha }}'
            executableSha256 = $exeHash
            appAsarSha256 = (Get-FileHash -Algorithm SHA256 -LiteralPath $appAsar).Hash.ToLowerInvariant()
            workerExeSha256 = (Get-FileHash -Algorithm SHA256 -LiteralPath $worker).Hash.ToLowerInvariant()
            acceptanceSha256 = (Get-FileHash -Algorithm SHA256 -LiteralPath $acceptance).Hash.ToLowerInvariant()
            retainedLedgerSha256 = (Get-FileHash -Algorithm SHA256 -LiteralPath (Join-Path $retained 'artifact-hashes.json')).Hash.ToLowerInvariant()
          } | ConvertTo-Json | Set-Content -LiteralPath 'artifacts/qi40-packaged-candidate/candidate-hashes.json' -Encoding utf8
      - name: Archive exact unpacked candidate and evidence
        uses: actions/upload-artifact@v4
        with:
          name: qi40-packaged-producer-${{ github.sha }}
          path: artifacts/qi40-packaged-candidate/
          compression-level: 0
          if-no-files-found: error
      - name: Prepare pinned NSIS 3.13
        shell: pwsh
        run: |
          $toolchain = Join-Path $env:RUNNER_TEMP ('qi40-nsis313-' + [guid]::NewGuid().ToString('N'))
          & ./scripts/prepare-qi40-nsis313.ps1 -OutputRoot $toolchain
      - name: Package pinned Theory Lab installer
        shell: pwsh
        run: |
          npx electron-builder --win nsis --config electron-builder.config.cjs --publish never
          if ($LASTEXITCODE -ne 0) { throw 'Pinned Theory Lab installer build failed' }
      - name: Verify installer component and packaged payload
        shell: pwsh
        run: |
          $installers = @(Get-ChildItem -LiteralPath release -Filter 'Quantum-Hamiltonian-Lab-Setup-*.exe' -File)
          if ($installers.Count -ne 1) { throw "Expected one installer; found $($installers.Count)" }
          $component = & ./scripts/verify-qi40-installer-nsis.ps1 -Installer $installers[0].FullName | ConvertFrom-Json
          $unpackedAsar = (Get-FileHash -Algorithm SHA256 -LiteralPath 'artifacts/qi40-packaged-candidate/win-unpacked/resources/app.asar').Hash.ToLowerInvariant()
          $installerAsar = (Get-FileHash -Algorithm SHA256 -LiteralPath 'release/win-unpacked/resources/app.asar').Hash.ToLowerInvariant()
          if ($unpackedAsar -ne $installerAsar) { throw 'Installer app.asar differs from the accepted unpacked producer' }
          $unpackedWorker = (Get-FileHash -Algorithm SHA256 -LiteralPath 'artifacts/qi40-packaged-candidate/win-unpacked/resources/quantum-worker/quantum-worker.exe').Hash.ToLowerInvariant()
          $installerWorker = (Get-FileHash -Algorithm SHA256 -LiteralPath 'release/win-unpacked/resources/quantum-worker/quantum-worker.exe').Hash.ToLowerInvariant()
          if ($unpackedWorker -ne $installerWorker) { throw 'Installer worker differs from the accepted unpacked producer' }
          [ordered]@{
            schema = 'theory-lab/qi40-pinned-installer/v1'
            sourceCommit = '${{ github.sha }}'
            installerName = $component.installer
            installerSha256 = $component.installerSha256
            systemDllSha256 = $component.systemDllSha256
            systemDllBytes = $component.systemDllBytes
            appAsarSha256 = $installerAsar
            workerExeSha256 = $installerWorker
          } | ConvertTo-Json | Set-Content -LiteralPath 'release/qi40-pinned-installer-evidence.json' -Encoding utf8
      - name: Archive exact pinned installer and evidence
        uses: actions/upload-artifact@v4
        with:
          name: qi40-pinned-installer-${{ github.sha }}
          path: |
            release/Quantum-Hamiltonian-Lab-Setup-*.exe
            release/qi40-pinned-installer-evidence.json
          compression-level: 0
          if-no-files-found: error
      - name: Probe clean installed Theory Lab payload
        shell: pwsh
        run: |
          $installers = @(Get-ChildItem -LiteralPath release -Filter 'Quantum-Hamiltonian-Lab-Setup-*.exe' -File)
          if ($installers.Count -ne 1) { throw "Expected one installer; found $($installers.Count)" }
          $installRoot = Join-Path $env:RUNNER_TEMP ('qi40-installed-lab-' + [guid]::NewGuid().ToString('N'))
          "QI40_INSTALL_ROOT=$installRoot" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          & ./scripts/probe-qi40-installed-lab.ps1 -Installer $installers[0].FullName -PackagedRoot 'release/win-unpacked' -InstallRoot $installRoot -EvidencePath 'test-results/qi40-installed-lab/probe.json'
      - name: Accept installed QWZ producer
        shell: pwsh
        run: |
          $installers = @(Get-ChildItem -LiteralPath release -Filter 'Quantum-Hamiltonian-Lab-Setup-*.exe' -File)
          node scripts/accept-qi40-installed-lab.mjs test-results/qi40-installed-lab/probe.json $installers[0].FullName release/win-unpacked $env:QI40_INSTALL_ROOT test-results/qi40-installed-lab/acceptance
          if ($LASTEXITCODE -ne 0) { throw 'Installed QWZ producer acceptance failed' }
      - name: Archive installed producer evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: qi40-installed-lab-${{ github.sha }}
          path: test-results/qi40-installed-lab/
          compression-level: 0
          if-no-files-found: ignore
